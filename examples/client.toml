# Optional client defaults. Files layer as /etc/tllama/client.toml then
# $XDG_CONFIG_HOME/tllama/client.toml (normally ~/.config/tllama/client.toml).
# --config PATH reads only that file, over built-in defaults.
# CLI flags override environment settings, which override file settings.
[client]
# host = "http://127.0.0.1:54800"
# timeout = 120 # Seconds; omit to retain command-dependent HTTP timeouts.

[display]
# decimal_units = false # Default: KiB/MiB/GiB/TiB; true: kB/MB/GB/TB.
# hide_thinking = false # Hide reasoning in completion output, not in saved messages/JSON.
# verbose = false # Print run/REPL request statistics to stderr.

[history]
# enabled = true # Persist REPL input history separately for each server/model.

[sessions]
# max_file_mib = 256 # Maximum complete JSON save/load size, including base64 images.

[images]
# max_file_mib = 16 # Maximum bytes per image before base64, including saved images.

[notifications]
# bell = false # BEL on stderr only when stderr is a terminal.
# bell_events = ["model_ready", "response_finished"]
# Other optional events: "pull_finished", "create_finished", "error".
