[build-system]
requires = ["setuptools>=61.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tllama"
dynamic = ["version"]
authors = [
    {name = "ByCzech", email = "byczech@malyjarda.cz"}
]
description = "TLlama - Terminator Llama AI Web Interface"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    # 0.3.23 and earlier keep a model reachable after it is unloaded, so its
    # memory is never returned and a server juggling several of them runs out.
    "llama-cpp-python>=0.3.35",
    "jinja2>=3.0.0",
    "gguf>=0.17.1",
    "uvicorn>=0.23.0",
    # Starlette runs streamed responses through anyio's worker threads, and
    # before 4.9 a worker kept the last callable it had run. With a model
    # handed to it that meant holding on to the whole thing until some other
    # request displaced it.
    "anyio>=4.9",
    # Reading the media type off an image's own bytes rather than
    # trusting a label. Ollama sends images as bare base64 with no type
    # at all, so there is nothing to trust in the first place. Preferred
    # over python-magic, which needs libmagic as a system library, and
    # over puremagic, which raises on unrecognised bytes where this
    # returns None -- and "not an image" is a case worth handling rather
    # than catching.
    "filetype>=1.2.0",
    # Virtual-model .toml files: parsing and, unlike tomllib (stdlib,
    # read-only) or tomli_w (write-only, drops comments), round-trip
    # writing that preserves a person's own comments and formatting when
    # TLlama rewrites a file in place (e.g. `from =` -> `model =` after an
    # import). See TLlama_virtual_models_spec.md §2 for why configparser and
    # the other TOML libraries were ruled out.
    "tomlkit>=0.13.0"
]

[project.optional-dependencies]
# Only used by the HuggingFace pull path, behind a guarded import.
huggingface = ["huggingface_hub>=0.30.0"]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx",
]

[project.scripts]
# Register tllama cmdline command
tllama = "tllama.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0-dev"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run the suite from a plain checkout, without an editable install.
pythonpath = ["src"]
# Async tests need no decorator, so a test reads the same whether or not the
# thing it exercises happens to be a coroutine.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
