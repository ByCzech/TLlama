[build-system]
requires = ["setuptools>=61.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tllama"
dynamic = ["version"]
authors = [
    {name = "ByCzech", email = "byczech@malyjarda.cz"}
]
description = "TLlama - Terminator Llama AI Web Interface"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "llama-cpp>=0.3.20",
    "jinja2>=3.0.0",
    "gguf>=0.17.1",
    "uvicorn>=0.23.0"
]

[project.optional-dependencies]
# Only used by the HuggingFace pull path, behind a guarded import.
huggingface = ["huggingface_hub>=0.30.0"]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx",
]

[project.scripts]
# Register tllama cmdline command
tllama = "tllama.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0-dev"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run the suite from a plain checkout, without an editable install.
pythonpath = ["src"]
# Async tests need no decorator, so a test reads the same whether or not the
# thing it exercises happens to be a coroutine.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
